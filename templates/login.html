<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · PokéGO Analyzer</title>
{% include 'partials/appearance_head.html' %}
</head><body class="auth-page"><main><h1><svg class="material-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h5m8 0h5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg> PokéGO Analyzer</h1><p id="subtitle">Sign in to your private Pokémon GO profile.</p><form id="form"><label>Username<input id="username" autocomplete="username" minlength="3" maxlength="32" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="12" required></label><p id="error" role="alert"></p><button id="submit" type="submit" class="primary">Sign in</button></form><div id="mode"><span id="hint">New here?</span><button class="text" id="toggle" type="button">Create profile</button></div></main><script>
let registering=false;const form=document.getElementById('form');document.getElementById('toggle').addEventListener('click',()=>{registering=!registering;document.getElementById('submit').textContent=registering?'Create profile':'Sign in';document.getElementById('toggle').textContent=registering?'Sign in':'Create profile';document.getElementById('hint').textContent=registering?'Already registered?':'New here?';document.getElementById('subtitle').textContent=registering?'Create your private Pokémon GO profile.':'Sign in to your private Pokémon GO profile.';document.getElementById('password').autocomplete=registering?'new-password':'current-password';document.getElementById('error').textContent=''});
form.addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit');button.disabled=true;try{const result=await fetch(registering?'/auth/register':'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await result.json();if(!result.ok)throw Error(data.error||'Authentication failed');location.replace('/verify')}catch(err){document.getElementById('error').textContent=err.message}finally{button.disabled=false}});
</script></body></html>
