<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · PokéGO Analyzer</title>
<style>:root{font-family:system-ui;color-scheme:dark;background:#06060b;color:#dde4f0}*{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}main{width:min(100%,410px);border:1px solid #2c4430;background:#0d0d14;border-radius:18px;padding:32px;box-shadow:0 20px 75px #0008}h1{font-size:28px;margin:0;color:#a3f050}p{color:#a5afba;font-size:14px}label{display:block;margin-top:18px;font-size:13px}input{width:100%;border:1px solid #38423c;border-radius:9px;background:#14141d;color:white;padding:13px;margin-top:6px;font-size:16px}button{border:0;border-radius:9px;padding:12px 16px;cursor:pointer;font-weight:700}button.primary{background:#a3f050;color:#111;width:100%;margin-top:20px}button.text{color:#a3f050;background:transparent}#error{color:#ff8282;min-height:1em;font-size:13px}#mode{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:#8e98a8}</style></head><body><main><h1>⚡ PokéGO Analyzer</h1><p id="subtitle">Sign in to your private Pokémon GO profile.</p><form id="form"><label>Username<input id="username" autocomplete="username" minlength="3" maxlength="32" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="12" required></label><p id="error" role="alert"></p><button id="submit" type="submit" class="primary">Sign in</button></form><div id="mode"><span id="hint">New here?</span><button class="text" id="toggle" type="button">Create profile</button></div></main><script>
let registering=false;const form=document.getElementById('form');document.getElementById('toggle').addEventListener('click',()=>{registering=!registering;document.getElementById('submit').textContent=registering?'Create profile':'Sign in';document.getElementById('toggle').textContent=registering?'Sign in':'Create profile';document.getElementById('hint').textContent=registering?'Already registered?':'New here?';document.getElementById('subtitle').textContent=registering?'Create your private Pokémon GO profile.':'Sign in to your private Pokémon GO profile.';document.getElementById('password').autocomplete=registering?'new-password':'current-password';document.getElementById('error').textContent=''});
form.addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit');button.disabled=true;try{const result=await fetch(registering?'/auth/register':'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await result.json();if(!result.ok)throw Error(data.error||'Authentication failed');location.replace('/verify')}catch(err){document.getElementById('error').textContent=err.message}finally{button.disabled=false}});
</script></body></html>
