<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Trainer · PokéGO Analyzer</title><style>:root{font-family:system-ui;color-scheme:dark;background:#06060b;color:#dde4f0}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}main{border:1px solid #384a36;background:#0d0d14;border-radius:18px;padding:30px;max-width:420px;width:100%}h1{color:#a3f050;font-size:23px}p{color:#aeb6c3;font-size:14px}label{display:block;margin-top:15px;font-size:13px}input{display:block;margin-top:7px;padding:12px;width:100%;box-sizing:border-box;background:#14141d;color:#fff;border:1px solid #414851;border-radius:8px}button{padding:12px;border:0;border-radius:8px;background:#a3f050;color:#101010;font-weight:700;width:100%;margin-top:20px}#message{min-height:25px}</style></head><body><main><h1>Verify your Trainer</h1><p>Before linking your Pokémon GO account, enter the date you created it. Your server administrator must first register a trusted account record.</p><form id="f"><label>Trainer name<input name="trainer" required maxlength="32" autocomplete="off"></label><label>Account creation date (UTC)<input name="creation_date" type="date" required></label><button>Verify Trainer</button></form><p id="message" role="status"></p><a href="/" style="color:#a3f050">Back to dashboard</a></main><script>document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();let f=e.target;let b=f.querySelector('button');b.disabled=true;try{let d=Object.fromEntries(new FormData(f).entries());let r=await fetch('/api/profile/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let j=await r.json();document.querySelector('#message').textContent=j.error||('Verified trainer '+j.trainer);if(r.ok)location.href='/';}catch(e){document.querySelector('#message').textContent=e.message}finally{b.disabled=false}})</script></body></html>
