<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Trainer · PokéGO Analyzer</title>{% include 'partials/appearance_head.html' %}
</head><body class="auth-page"><main><h1>Verify your Trainer</h1><p>Before linking your Pokémon GO account, enter the date you created it. Your server administrator must first register a trusted account record.</p><form id="f"><label>Trainer name<input name="trainer" required maxlength="32" autocomplete="off"></label><label>Account creation date (UTC)<input name="creation_date" type="date" required></label><button>Verify Trainer</button></form><p id="message" role="status"></p><a href="/" >Back to dashboard</a></main><script>document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();let f=e.target;let b=f.querySelector('button');b.disabled=true;try{let d=Object.fromEntries(new FormData(f).entries());let r=await fetch('/api/profile/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let j=await r.json();document.querySelector('#message').textContent=j.error||('Verified trainer '+j.trainer);if(r.ok)location.href='/';}catch(e){document.querySelector('#message').textContent=e.message}finally{b.disabled=false}})</script></body></html>
