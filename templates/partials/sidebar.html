{% from 'partials/menu_icons.html' import menu_icon %}
<aside id="sidebar">
  <div class="sidebar-header">
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 8px;">
      <div class="logo"><svg class="material-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h5m8 0h5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>PokéGO <span>Analyzer</span></div>
      
    </div>
    <p id="header-sub">Upload PGSStats.json or CSV to begin</p>
    <div id="upload-small">
      <div class="btn btn-outline btn-sm">{{ mdi('refresh') }} Change file</div>
      <input type="file" accept=".json,.csv" id="upload-input-small">
    </div>
  </div>

  <!-- Player Card in Sidebar -->
  <div id="sidebar-player" style="display: none; padding: 10px 16px; border-bottom: 1px solid var(--border); align-items: center; gap: 10px;">
    <div id="s-player-avatar" style="width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; border: 2px solid var(--muted); flex-shrink: 0; background: var(--bg3);"></div>
    <div style="display: flex; flex-direction: column; overflow: hidden; line-height: 1.35;">
      <div id="s-player-name" style="font-weight: 700; color: var(--text); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
      <div id="s-player-resources" class="supporting-text"></div><div id="s-player-progress" role="progressbar" aria-label="XP toward next level" aria-valuemin="0" aria-valuemax="100"><span></span></div><div id="s-player-progress-label" class="supporting-text"></div><div id="s-player-level" style="font-size: 11px; color: var(--muted); font-family: var(--fm);"></div>
    </div>
  </div>

  <nav id="tabs" aria-label="Main navigation">
    <button class="tab active" data-tab="pokemon"><svg class="material-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h5m8 0h5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>Pokémon<span class="tab-badge" id="tb-poke"></span></button>
    <button class="tab" data-tab="pokedex">{{ menu_icon('pokedex') }}Pokédex</button>
    <button class="tab" data-tab="forms">{{ mdi('dna') }}Special Forms</button>
    <button class="tab" data-tab="items"><svg class="material-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 8v12c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2V8c0-2.42 1.72-4.44 4-4.9V2h2v1h4V2h2v1.1c2.28.46 4 2.48 4 4.9zM6 12v2h10v2h2v-4H6z"/></svg>Inventory</button>
    <button class="tab" data-tab="develop">{{ menu_icon('improve') }}Workshop</button>
    <button class="tab" data-tab="search">{{ mdi('filter-variant') }}Query Builder</button>
    <button class="tab" data-tab="pvp">{{ menu_icon('pvp') }}PvP</button>
    <button class="tab" data-tab="raid">{{ menu_icon('raid') }}Raids</button>
    <button class="tab" data-tab="tiers"><svg class="material-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 22V7h6v15H2zm7 0V2h6v20H9zm7 0V12h6v10h-6z"/></svg>Tier List</button>
    <button class="tab" data-tab="events"><svg class="material-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zm-7-9h5v5h-5z"/></svg>Events</button>
    <button class="tab" data-tab="history">{{ mdi('history') }}History</button>
    <button class="tab" data-tab="settings"><svg class="material-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m19.14 12.94.04-.94-.04-.94 2.03-1.58-1.92-3.32-2.39.96a7 7 0 0 0-1.63-.95L14.87 3h-3.84l-.36 2.17c-.59.24-1.13.56-1.63.95l-2.39-.96-1.92 3.32 2.03 1.58-.04.94.04.94-2.03 1.58 1.92 3.32 2.39-.96c.5.39 1.04.71 1.63.95l.36 2.17h3.84l.36-2.17a7 7 0 0 0 1.63-.95l2.39.96 1.92-3.32-2.03-1.58zM13 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>Settings</button>
  </nav>

  <div style="padding:10px 16px;border-top:1px solid var(--border);font-size:12px"><div>Signed in as <strong id="auth-username">—</strong></div><button id="auth-logout" type="button" class="btn btn-outline btn-sm">Sign out</button></div>
  <div class="sidebar-hint">Upload JSON or CSV to begin</div>
<p class="asset-credit">Game artwork: <a href="https://github.com/PokeMiners/pogo_assets" target="_blank" rel="noopener noreferrer">PokeMiners</a>.</p>
</aside>
